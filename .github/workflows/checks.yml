name: Addon checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_catalog.py
      - run: python tools/audit_catalog.py
      - run: python tests/run_tests.py
      - run: python tools/prepare_logo.py --check
      - run: python tools/review_layouts.py
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: UpgradeCrossroads-install-zip
          path: dist/*-forever.zip
          if-no-files-found: error
